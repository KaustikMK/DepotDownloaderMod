name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # `tools` was removed from the SDK repository; override the action's
      # legacy default package list so sdkmanager only installs supported tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Publish bundled Android runtime
        run: |
          dotnet publish DepotDownloader/DepotDownloaderMod.csproj --configuration Release --runtime android-arm64 --self-contained true --output android/app/src/main/assets/depotdownloader
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            android/native/depotdownloader-host.cpp -ldl -o android/app/src/main/jniLibs/arm64-v8a/libdepotdownloader.so
      - name: Assemble Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: >
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs
          android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DepotDownloaderMod-android-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
