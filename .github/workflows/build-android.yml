name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # `tools` was removed from the SDK repository; override the action's
      # legacy default package list so sdkmanager only installs supported tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      # The repository does not contain a distributable Android executable.  Keep
      # the CI artifact useful for UI/development testing, while leaving the
      # bundled-binary check enabled for normal and release builds.
      - name: Assemble development debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug -x :app:verifyBundledDownloader
      - uses: actions/upload-artifact@v4
        with:
          name: DepotDownloaderMod-android-development-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
